<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center transition-colors duration-500" id="bg-body">

    <!-- Main Timer Container -->
    <div class="glass-panel p-10 rounded-3xl shadow-2xl text-center max-w-md w-full border border-slate-700 relative">
        
        <!-- Settings Button -->
        <button onclick="toggleSettings()" class="absolute top-6 right-6 text-slate-400 hover:text-white transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <h1 class="text-2xl font-semibold tracking-widest text-teal-400 mb-2">OASIS</h1>
        <p id="mode-label" class="text-sm font-medium text-slate-400 uppercase tracking-widest mb-6">Focus Session</p>

        <!-- Timer Display -->
        <div id="timer-display" class="text-7xl font-light tabular-nums mb-8">25:00</div>

        <!-- Controls -->
        <div class="flex justify-center space-x-4">
            <button id="start-btn" onclick="toggleTimer()" class="bg-teal-600 hover:bg-teal-500 text-white px-8 py-3 rounded-full font-medium transition shadow-lg w-32">
                Start
            </button>
            <button onclick="resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-white px-8 py-3 rounded-full font-medium transition shadow-lg w-32">
                Reset
            </button>
        </div>

        <!-- Session Tracker -->
        <div class="mt-8 flex justify-center space-x-2" id="session-tracker">
            <div class="w-2 h-2 rounded-full bg-slate-600 dot"></div>
            <div class="w-2 h-2 rounded-full bg-slate-600 dot"></div>
            <div class="w-2 h-2 rounded-full bg-slate-600 dot"></div>
            <div class="w-2 h-2 rounded-full bg-slate-600 dot"></div>
        </div>
    </div>

    <!-- Settings Modal (Hidden by default) -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-slate-700">
            <h2 class="text-xl font-semibold mb-6">Timer Settings (Minutes)</h2>
            
            <div class="space-y-4 mb-8">
                <div class="flex justify-between items-center">
                    <label class="text-slate-300">Focus Duration</label>
                    <input type="number" id="input-focus" class="w-20 bg-slate-900 border border-slate-600 rounded p-2 text-center text-white focus:outline-none focus:border-teal-400" min="1" max="120">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-slate-300">Short Break</label>
                    <input type="number" id="input-short" class="w-20 bg-slate-900 border border-slate-600 rounded p-2 text-center text-white focus:outline-none focus:border-teal-400" min="1" max="60">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-slate-300">Long Break</label>
                    <input type="number" id="input-long" class="w-20 bg-slate-900 border border-slate-600 rounded p-2 text-center text-white focus:outline-none focus:border-teal-400" min="1" max="60">
                </div>
            </div>

            <div class="flex space-x-3">
                <button onclick="saveSettings()" class="flex-1 bg-teal-600 hover:bg-teal-500 py-2 rounded-lg font-medium transition">Save</button>
                <button onclick="toggleSettings()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg font-medium transition">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Default Config & State
        let settings = { focus: 25, shortBreak: 5, longBreak: 15 };
        let timeLeft;
        let isRunning = false;
        let timerInterval;
        let currentMode = 'focus'; // focus, shortBreak, longBreak
        let sessionsCompleted = 0;

        // Elements
        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const modeLabel = document.getElementById('mode-label');
        const bgBody = document.getElementById('bg-body');
        const dots = document.querySelectorAll('.dot');
        const modal = document.getElementById('settings-modal');

        // Initialize
        function init() {
            const saved = localStorage.getItem('oasisSettings');
            if (saved) settings = JSON.parse(saved);
            
            document.getElementById('input-focus').value = settings.focus;
            document.getElementById('input-short').value = settings.shortBreak;
            document.getElementById('input-long').value = settings.longBreak;
            
            resetTimer();
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.title = `${display.textContent} - Oasis Timer`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.textContent = 'Start';
                startBtn.classList.replace('bg-amber-600', 'bg-teal-600');
                startBtn.classList.replace('hover:bg-amber-500', 'hover:bg-teal-500');
            } else {
                timerInterval = setInterval(tick, 1000);
                startBtn.textContent = 'Pause';
                startBtn.classList.replace('bg-teal-600', 'bg-amber-600');
                startBtn.classList.replace('hover:bg-teal-500', 'hover:bg-amber-500');
            }
            isRunning = !isRunning;
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                playChime();
                switchMode();
            }
        }

        function switchMode() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.classList.replace('bg-amber-600', 'bg-teal-600');
            startBtn.classList.replace('hover:bg-amber-500', 'hover:bg-teal-500');

            if (currentMode === 'focus') {
                sessionsCompleted++;
                updateDots();
                if (sessionsCompleted % 4 === 0) {
                    currentMode = 'longBreak';
                    timeLeft = settings.longBreak * 60;
                    modeLabel.textContent = 'Long Break';
                    bgBody.classList.replace('bg-slate-900', 'bg-indigo-950');
                } else {
                    currentMode = 'shortBreak';
                    timeLeft = settings.shortBreak * 60;
                    modeLabel.textContent = 'Short Break';
                    bgBody.classList.replace('bg-slate-900', 'bg-emerald-950');
                }
            } else {
                currentMode = 'focus';
                timeLeft = settings.focus * 60;
                modeLabel.textContent = 'Focus Session';
                bgBody.className = 'bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center transition-colors duration-500';
            }
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.classList.replace('bg-amber-600', 'bg-teal-600');
            startBtn.classList.replace('hover:bg-amber-500', 'hover:bg-teal-500');
            
            currentMode = 'focus';
            modeLabel.textContent = 'Focus Session';
            bgBody.className = 'bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center transition-colors duration-500';
            timeLeft = settings.focus * 60;
            sessionsCompleted = 0;
            updateDots();
            updateDisplay();
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < (sessionsCompleted % 4) || (sessionsCompleted > 0 && sessionsCompleted % 4 === 0 && index === 3)) {
                    dot.classList.replace('bg-slate-600', 'bg-teal-400');
                } else {
                    dot.classList.replace('bg-teal-400', 'bg-slate-600');
                }
            });
            if(sessionsCompleted % 4 === 0 && sessionsCompleted !== 0) {
                 setTimeout(() => {
                     dots.forEach(dot => dot.classList.replace('bg-teal-400', 'bg-slate-600'));
                 }, 2000);
            }
        }

        function toggleSettings() {
            modal.classList.toggle('hidden');
        }

        function saveSettings() {
            const newFocus = parseInt(document.getElementById('input-focus').value);
            const newShort = parseInt(document.getElementById('input-short').value);
            const newLong = parseInt(document.getElementById('input-long').value);

            if (newFocus > 0 && newShort > 0 && newLong > 0) {
                settings = { focus: newFocus, shortBreak: newShort, longBreak: newLong };
                localStorage.setItem('oasisSettings', JSON.stringify(settings));
                toggleSettings();
                resetTimer(); // Apply new settings immediately
            }
        }

        // Web Audio API Chime
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 2);
                osc.stop(ctx.currentTime + 2);
            } catch (e) { console.log("Audio not supported or permitted"); }
        }

        // Keyboard Shortcut (Spacebar to start/pause)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && modal.classList.contains('hidden')) {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'Escape' && !modal.classList.contains('hidden')) {
                toggleSettings();
            }
        });

        init();
    </script>
</body>
</html>
